services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo
      POSTGRES_DB: nexo
    ports:
      - "5433:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexo"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  dados-postgres:
