pre-commit:
  parallel: true
  jobs:
    - name: typecheck
      run: npm run typecheck
    - name: lint
      glob: "*.{ts,js}"
      run: npx eslint --max-warnings=0 {staged_files}
    - name: format
      glob: "*.{ts,js,json,md,yml}"
      run: npx prettier --check {staged_files}
    - name: test
      run: npm test

commit-msg:
  jobs:
    - name: commitlint
      run: npx commitlint --edit {1}
