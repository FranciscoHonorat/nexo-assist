name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: nexo
          POSTGRES_PASSWORD: nexo
          POSTGRES_DB: nexo_teste
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U nexo -d nexo_teste"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://nexo:nexo@localhost:5433/nexo_teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.URL_DE_PRODUCAO }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      URL_DE_PRODUCAO: ${{ vars.URL_DE_PRODUCAO }}
    steps:
      - uses: actions/checkout@v4
      - name: Grava a versão que vai para o ar
        run: echo "$GITHUB_SHA" > VERSAO
      - name: Envia ao Railway
        run: npx --yes @railway/cli@5.68.0 up --ci --service "${{ vars.RAILWAY_SERVICE }}"
      - name: Confere que a versão nova está no ar
        run: |
          for _ in $(seq 1 60); do
            no_ar=$(curl -fsS "$URL_DE_PRODUCAO/api/saude" | jq -r .versao || true)
            if [ "$no_ar" = "$GITHUB_SHA" ]; then
              echo "Versão $GITHUB_SHA no ar."
              exit 0
            fi
            sleep 10
          done
          echo "A versão $GITHUB_SHA não entrou no ar em 10 minutos; no ar está: ${no_ar:-nada}."
          exit 1
